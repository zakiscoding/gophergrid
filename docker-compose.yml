# GopherGrid local stack. Ports bind to 127.0.0.1 only.
#   scripts/build.sh && docker compose up -d             # build images, run it
#   docker compose --profile test run --rm tester        # integration tests (kill workers and the leader)
# POSTGRES_PASSWORD defaults to a local-dev value; set it in .env (gitignored) for anything else.
name: gophergrid

x-scheduler: &scheduler
  build: { context: ., target: scheduler }   # scripts/build.sh builds the same images
  image: gophergrid/scheduler:dev
  restart: "no"            # a killed instance stays dead, so failover tests mean something
  depends_on:
    postgres: { condition: service_healthy }
    etcd: { condition: service_started }
  environment: &scheduler-env
    DATABASE_URL: postgres://gophergrid:${POSTGRES_PASSWORD:-gophergrid}@postgres:5432/gophergrid?sslmode=disable
    ETCD_ENDPOINTS: etcd:2379
    ELECTION_TTL_SECONDS: "5"
    HEARTBEAT_INTERVAL: 500ms
    HEARTBEAT_TIMEOUT: 3s
    LEASE_TTL: 10s
    PRIORITY_AGING: 60s
    HEARTBEAT_LONG_POLL: ${HEARTBEAT_LONG_POLL:-400ms}  # 0s = reply at once (docs/RESULTS.md)

x-worker: &worker
  build: { context: ., target: worker }
  image: gophergrid/worker:dev
  restart: "no"
  depends_on: [scheduler-1, scheduler-2]
  environment: &worker-env
    SCHEDULER_ADDRS: scheduler-1:9090,scheduler-2:9090
    HEARTBEAT_INTERVAL: 500ms
    EAGER_SYNC: ${EAGER_SYNC:-true}
    CPU_MILLIS: "2000"
    MEMORY_MB: "2048"
    GPU_MODE: none
    LOG_LEVEL: info
    # `llm` jobs go to the fake OpenAI server below (a live vLLM on the homelab).
    LLM_URL: http://fakellm:8000/v1
    LLM_API_KEY: test-key
    LLM_MODEL: fake-qwen

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gophergrid
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gophergrid}
      POSTGRES_DB: gophergrid
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gophergrid -d gophergrid"]
      interval: 2s
      timeout: 3s
      retries: 30

  etcd:
    image: quay.io/coreos/etcd:v3.6.6
    command:
      - etcd
      - --name=etcd0
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-cluster=etcd0=http://etcd:2380
    volumes: [etcddata:/etcd-data]

  scheduler-1:
    <<: *scheduler
    environment: { <<: *scheduler-env, ADVERTISE_ADDR: "scheduler-1:9090" }
    ports: ["127.0.0.1:8080:8080"]
  scheduler-2:
    <<: *scheduler
    environment: { <<: *scheduler-env, ADVERTISE_ADDR: "scheduler-2:9090" }
    ports: ["127.0.0.1:8081:8080"]

  worker-1:
    <<: *worker
    environment: { <<: *worker-env, WORKER_ID: worker-1 }
  worker-2:
    <<: *worker
    environment: { <<: *worker-env, WORKER_ID: worker-2 }
  worker-3:
    <<: *worker
    environment: { <<: *worker-env, WORKER_ID: worker-3 }

  fakellm:
    build: { context: ., target: fakellm }
    image: gophergrid/fakellm:dev
    environment: { FAKE_LATENCY: 100ms, FAKE_TOKEN_LATENCY: 50ms, FAKE_API_KEY: test-key }

  # Simulated GPU workers (GPU_MODE=sim): placement, GPU memory limits and inference
  # fan-out run without hardware. On the real GPU node use GPU_MODE=nvidia (docs/homelab.md).
  gpu-worker-1:      # like the homelab RTX 5070, twice
    <<: *worker
    environment: { <<: *worker-env, WORKER_ID: gpu-worker-1, CPU_MILLIS: "4000", MEMORY_MB: "8192",
                   GPU_MODE: sim, SIM_GPUS: "2", SIM_GPU_MEMORY_MB: "12288", SIM_GPU_MODEL: sim-rtx-5070 }
  gpu-worker-2:      # like one rented H100
    <<: *worker
    environment: { <<: *worker-env, WORKER_ID: gpu-worker-2, CPU_MILLIS: "4000", MEMORY_MB: "8192",
                   GPU_MODE: sim, SIM_GPUS: "1", SIM_GPU_MEMORY_MB: "81920", SIM_GPU_MODEL: sim-h100-80gb }

  prometheus:
    image: prom/prometheus:v3.5.0
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.retention.time=2d]
    volumes: [./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    ports: ["127.0.0.1:9090:9090"]

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"      # local, view-only dashboards
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/gophergrid.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus]

  # docker compose --profile autoscale up -d autoscaler
  autoscaler:
    profiles: [autoscale]
    build: { context: ., target: autoscaler }
    image: gophergrid/autoscaler:dev
    depends_on: [scheduler-1, scheduler-2]
    environment:
      SCHEDULER_URLS: http://scheduler-1:8080,http://scheduler-2:8080
      TEMPLATE_CONTAINER: gophergrid-worker-1-1
      MIN_WORKERS: "0"
      MAX_WORKERS: "4"
      TARGET_QUEUE_PER_WORKER: "100"
      COOLDOWN: ${AUTOSCALE_COOLDOWN:-30s}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  tester:
    profiles: [test]
    build: { context: ., target: tester }
    image: gophergrid/tester:dev
    depends_on: [scheduler-1, scheduler-2]
    environment:
      SCHEDULER_URLS: http://scheduler-1:8080,http://scheduler-2:8080
      DATABASE_URL: postgres://gophergrid:${POSTGRES_PASSWORD:-gophergrid}@postgres:5432/gophergrid?sslmode=disable
      TEST_DATABASE_URL: postgres://gophergrid:${POSTGRES_PASSWORD:-gophergrid}@postgres:5432/gophergrid_test?sslmode=disable
      COMPOSE_PROJECT: gophergrid
      FAKELLM_URL: http://fakellm:8000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  pgdata:
  etcddata:
