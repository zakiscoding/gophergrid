[package]
name = "gophergrid-worker"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "GopherGrid worker in Rust: the same gRPC protocol and guarantees as the Go worker"
license = "MIT"
publish = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["tokio", "http1"] }
hex = "0.4"
libc = "0.2"
prometheus = { version = "0.14", features = ["process"] }
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "process", "net", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
tonic = "0.14"
tonic-prost = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

[dev-dependencies]
tokio-stream = { version = "0.1", features = ["net"] }

[build-dependencies]
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
