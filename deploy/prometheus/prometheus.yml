global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: scheduler
    static_configs:
      - targets: [scheduler-1:8080, scheduler-2:8080]
  - job_name: worker
    static_configs:
      - targets: [worker-1:9100, worker-2:9100, worker-3:9100, gpu-worker-1:9100, gpu-worker-2:9100]
  - job_name: autoscaler
    static_configs:
      - targets: [autoscaler:9200]
