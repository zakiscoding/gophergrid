# The GPU PC: scheduler-2 (the iMac's scheduler-1 fails over to it), the worker `gpu-pc` that
# reports the real RTX 5070 from nvidia-smi, and the CPU-only worker `gpu-pc-cpu`. Runs in WSL2 on
# the Windows boot (zakar) or on the Ubuntu boot (zak-gpu-node). scheduler-2 reaches Postgres and
# etcd on mos-imac over the tailnet; POSTGRES_PASSWORD comes from .env next to this file.
#
#   docker compose -p gophergrid --env-file deploy/homelab/.env -f deploy/homelab/gpu-pc.yml up -d
#
# Set GPU_PC_TS_IP=100.121.51.35 on the Ubuntu boot. Ports bind to 127.0.0.1 and are shared on
# the tailnet with `tailscale serve` (docs/homelab.md).
#
# Real work (docs/homelab.md):
#   llm        prompts to the live vLLM chat server (vllm-chat), over its compose network
#   benchmark  gpu-systems-lab suites in the vLLM image, on the card, files in BENCH_OUT_DIR
name: gophergrid

x-schedulers: &schedulers ${IMAC_TS_IP:-100.91.113.98}:9095,${GPU_PC_TS_IP:-100.88.71.33}:9095

services:
  scheduler-2:
    image: gophergrid/scheduler:dev
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://gophergrid:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@${IMAC_TS_IP:-100.91.113.98}:5433/gophergrid?sslmode=disable
      ETCD_ENDPOINTS: ${IMAC_TS_IP:-100.91.113.98}:2379
      ADVERTISE_ADDR: ${GPU_PC_TS_IP:-100.88.71.33}:9095   # workers follow this when it leads
      HEARTBEAT_TIMEOUT: ${HEARTBEAT_TIMEOUT:-3s}
    ports:
      - "127.0.0.1:9095:9090"   # gRPC
      - "127.0.0.1:8091:8080"   # REST and /metrics

  cpu-worker:
    image: ${WORKER_IMAGE:-gophergrid/worker:dev}
    restart: unless-stopped
    environment:
      WORKER_ID: gpu-pc-cpu
      SCHEDULER_ADDRS: *schedulers
      GPU_MODE: none
      CPU_MILLIS: "4000"
      MEMORY_MB: "4096"
    ports: ["127.0.0.1:9103:9100"]

  gpu-worker:
    image: ${WORKER_IMAGE:-gophergrid/worker:dev}   # gophergrid/worker-rs:dev for the Rust worker
    restart: unless-stopped
    # VLLM_API_KEY for llm jobs, from the serving stack's own .env (never in this repo).
    env_file: [{ path: "${VLLM_ENV_FILE:-/root/gpu-systems-lab/serving/.env}", required: false }]
    environment:
      WORKER_ID: gpu-pc
      SCHEDULER_ADDRS: *schedulers
      GPU_MODE: nvidia
      # vLLM keeps most of the card. Only memory.total minus this is offered to jobs.
      GPU_RESERVED_MB: ${GPU_RESERVED_MB:-11300}
      CPU_MILLIS: "8000"
      MEMORY_MB: "8192"
      ENABLE_CONTAINERS: "true"   # `container` jobs run with docker run --gpus device=<uuid>
      LLM_URL: ${LLM_URL:-http://vllm-chat:8000/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5-1.5b-instruct}
      LLM_CONCURRENCY: "8"
      BENCH_IMAGE: ${BENCH_IMAGE:-vllm/vllm-openai:v0.32.0}
      BENCH_LAB_DIR: ${BENCH_LAB_DIR:-/root/gg-lab}           # a gpu-systems-lab checkout
      BENCH_HF_CACHE: ${BENCH_HF_CACHE:-/root/.cache/huggingface}
      BENCH_OUT_DIR: ${BENCH_OUT_DIR:-/root/gophergrid/bench-out}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Same path inside and out: the worker reads what the benchmark container writes.
      - ${BENCH_OUT_DIR:-/root/gophergrid/bench-out}:${BENCH_OUT_DIR:-/root/gophergrid/bench-out}
    networks: [default, serving]
    ports: ["127.0.0.1:9102:9100"]   # 9100 is the GPU node's node-exporter
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: all, capabilities: [gpu, utility] }]

networks:
  # gpu-systems-lab/serving's compose network, where vllm-chat answers on :8000.
  serving:
    external: true
    name: ${SERVING_NETWORK:-serving_default}
